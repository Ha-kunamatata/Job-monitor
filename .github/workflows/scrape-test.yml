name: 스크래퍼 점검 (수집만)

# 이메일/AI 키 없이 각 사이트의 수집 여부만 확인하는 수동 점검용 워크플로.
# 저장소 → Actions → "스크래퍼 점검 (수집만)" → Run workflow 로 실행하고
# 로그에서 사이트별 수집 건수를 확인하세요.
on:
  workflow_dispatch:

jobs:
  scrape-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 스크래퍼 점검 실행
        run: python scrape_test.py
