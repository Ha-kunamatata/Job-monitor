name: 채용 공고 모니터링

on:
  schedule:
    # UTC 기준. 한국시간(KST) = UTC+9
    # 매일 KST 09:00 (UTC 00:00), KST 18:00 (UTC 09:00)
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:  # 수동 실행 버튼도 제공

# 상태 파일(seen_jobs.json)을 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 모니터링 실행
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: 상태 파일 커밋 (본 공고 기록 유지)
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "update seen jobs [skip ci]"
          git push
